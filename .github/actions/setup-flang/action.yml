name: 'Setup LLVM Flang'
description: >-
  Installs LLVM Flang, clang and LLVM's OpenMP runtime from MSYS2 on Windows x64
  runners and exports FC, CC, CXX and FPM_FC, FPM_CC, FPM_CXX, like
  fortran-lang/setup-fortran does. setup-fortran v1.11.0 does not provide LLVM
  Flang on Windows. Replace with setup-fortran once it does, keeping the stack
  reserve in the last steps.

inputs:
  version:
    description: >-
      LLVM major version. MSYS2 only has its current LLVM, which must match.
    required: true

runs:
  using: "composite"
  steps:
    - name: Install LLVM Flang from MSYS2
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        # The runner image's package database is stale: without an update it
        # installs an older LLVM, whose EXECUTE_COMMAND_LINE fails on Windows
        update: true
        install: >-
          mingw-w64-clang-x86_64-flang
          mingw-w64-clang-x86_64-llvm-openmp

    - name: Put LLVM Flang on PATH
      shell: bash
      run: |
        echo "${{ steps.msys2.outputs.msys2-location }}\clang64\bin" >> "$GITHUB_PATH"

    - name: Set LLVM Flang environment
      shell: bash
      run: |
        {
          echo "FC=flang"; echo "CC=clang"; echo "CXX=clang++"
          echo "FPM_FC=flang"; echo "FPM_CC=clang"; echo "FPM_CXX=clang++"
        } >> "$GITHUB_ENV"
        # Flang may keep string temporaries on the stack across loop iterations
        # (llvm/llvm-project#194828): reserve 8 MB as on Linux, not 1 MB
        echo "FPM_LDFLAGS=-Wl,--stack,8388608" >> "$GITHUB_ENV"

    - name: Check LLVM Flang version
      shell: bash
      run: |
        v=$(flang --version)
        echo "$v"
        [[ "$v" =~ version\ ${{ inputs.version }}\. ]] || {
          echo "::error::expected LLVM Flang ${{ inputs.version }}"
          exit 1
        }
