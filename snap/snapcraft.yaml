name: fortran-fpm
adopt-info: fortran-fpm
summary: Fortran Package Manager
description: |
  Fortran Package Manager (fpm) is a package manager and build system for Fortran. 
  Its key goal is to improve the user experience of Fortran programmers. 
  It does so by making it easier to build your Fortran program or library, 
  run the executables, tests, and examples, and distribute it as a dependency 
  to other Fortran projects. Fpm's user interface is modeled after Rust's Cargo, 
  so if you're familiar with that tool, you will feel at home with fpm. 
  Fpm's long term vision is to nurture and grow the ecosystem of modern Fortran 
  applications and libraries.
  
  Fpm is an early prototype and is evolving rapidly. You can use it to build and 
  package your Fortran projects, as well as to use existing fpm packages as dependencies. 
  Fpm's behavior and user interface may change as it evolves, however as fpm matures 
  and we enter production, we will aim to stay backwards compatible. Please follow 
  the issues to contribute and/or stay up to date with the development. 
  Before opening a bug report or a feature suggestion, please read our Contributor Guide. 
  You can also discuss your ideas and queries with the community in fpm discussions, 
  or more broadly on Fortran-Lang Discourse. 
  
  Fortran Package Manager is not to be confused with Jordan Sissel's fpm, a more general, 
  non-Fortran related package manager.
  
  Website: https://fpm.fortran-lang.org/
  
license: MIT
source-code: https://github.com/fortran-lang/fpm
issues: https://github.com/kz6fittycent/fpm/issues
contact: https://github.com/kz6fittycent/fpm
icon: snap/local/fpm.png

base: core24
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  # Cross-compiled
  armhf:
    build-on: [amd64]
    build-for: [armhf]
  ppc64el:
    build-on: [amd64]
    build-for: [ppc64el]
  s390x:
    build-on: [amd64]
    build-for: [s390x]

apps:
  fortran-fpm:
    command: usr/bin/fpm
    plugs: 
      - home
      
parts:
  fortran-fpm:
    source: https://github.com/fortran-lang/fpm
    source-type: git
    plugin: nil
    build-packages:
      - curl
      - git
      - gcc
      - gfortran
      - on amd64 to armhf:
          - gcc-arm-linux-gnueabihf
          - gfortran-arm-linux-gnueabihf
      - on amd64 to ppc64el:
          - gcc-powerpc64le-linux-gnu
          - gfortran-powerpc64le-linux-gnu
      - on amd64 to s390x:
          - gcc-s390x-linux-gnu
          - gfortran-s390x-linux-gnu
    # amd64/arm64: staged rather than static, so Ubuntu's security fixes reach the
    # snap and the Security Rebuild workflow can see when they're needed. The
    # cross-compiled ones link the toolchain's libgfortran statically, because
    # their packages aren't in the build machine's archive; they are rebuilt
    # along with the others.
    stage-packages:
      - on amd64 to amd64:
          - libgfortran5
      - on arm64 to arm64:
          - libgfortran5

    override-pull: |
      craftctl default
      TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9.]+$' | head -1)
      git checkout -q "$TAG"
      craftctl set version="${TAG#v}"

    override-build: |
      TRIPLET="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      # fpm builds itself: first a bootstrap copy (for the build machine) from the
      # single-file release source, then the real one for the target.
      VERSION=$(git describe --tags --exact-match | sed 's/^v//')
      curl -fsSL --retry 5 -o "$CRAFT_PART_BUILD/bootstrap.F90" \
        "https://github.com/fortran-lang/fpm/releases/download/v${VERSION}/fpm-${VERSION}.F90"
      mkdir -p bootstrap
      (cd bootstrap && gfortran -O1 ../bootstrap.F90 -o fpm)
      LINK=""
      if [ "$CRAFT_ARCH_BUILD_ON" != "$CRAFT_ARCH_BUILD_FOR" ]; then
        LINK="-static-libgfortran -static-libquadmath -static-libgcc"
      fi
      ./bootstrap/fpm install --compiler "${TRIPLET}-gfortran" --c-compiler "${TRIPLET}-gcc" \
        --profile release --link-flag "$LINK" --prefix "$CRAFT_PART_INSTALL/usr"
